<!doctype html>
<html lang="id">
  <head>
    <meta content="text/html;charset=utf-8" http-equiv="Content-Type" />
    <meta content="utf-8" http-equiv="encoding" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, minimal-ui"
    />
    <meta name="theme-color" content="#06100f" />
    <title>BreakRoom 8 - Multiplayer Pool</title>
    <link rel="stylesheet" href="site.css" />
    <script src="runtime-config.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="online-multiplayer.js"></script>
    <script>
      window.gameID = "8-ball-billiards-classic";
      window.gameJS = [
        "assets/src/01phaser.js",
        "assets/src/02Ball.js",
        "assets/src/03contactListener.js",
        "assets/src/04billiardPhysics.js",
        "assets/src/05levelData.js",
        "assets/src/06maths.js",
        "assets/src/07vector2d.js",
        "assets/src/08render.js",
        "assets/src/09sound.js",
        "assets/src/10effects.js",
        "assets/src/11timer.js",
        "assets/src/12load.js",
        "assets/src/13mainMenu.js",
        "assets/src/14setup.js",
        "assets/src/15gameController.js",
        "assets/src/16boot.js",
        function () {},
      ];
      (function (document, url, fgJS, firstJS) {
        fgJS = document.createElement("script");
        firstJS = document.getElementsByTagName("script")[0];
        fgJS.src = url + "";
        firstJS.parentNode.insertBefore(fgJS, firstJS);
      })(document, "html5games/gameapi/v1.js");
    </script>
  </head>
  <body>
    <div class="site-frame">
      <header class="site-topbar">
        <div class="brand">
          <span class="brand-mark">8</span>
          <div>
            <strong>BreakRoom 8</strong>
            <small>Modern HTML5 billiards</small>
          </div>
        </div>
        <div class="deploy-status">
          <span>Vercel ready</span>
          <span>Supabase realtime multiplayer</span>
        </div>
      </header>

      <main class="game-shell">
        <div id="mygame"></div>
      </main>
    </div>
  </body>
</html>
